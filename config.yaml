# Configuración de ubika.
# Los secretos (DATABASE_URL, GOOGLE_GEOCODING_API_KEY) van en .env, nunca aquí.

scraping:
  headless: true
  timeout_ms: 60000
  pausa_seg: [4, 8]              # pausa aleatoria entre páginas del listado
  pausa_detalle_seg: [20, 35]    # pausa entre fichas: el portal bloquea las fichas mucho antes que el listado
  max_paginas: 5                 # el robots.txt de ambos portales solo permite a los robots las páginas 2 a 5 de cada listado
  fuentes:
    adondevivir:
      activo: true
      # Un listado por distrito (slug del portal): con el tope de 5 páginas, un solo listado
      # de Lima no pasa de ~130 avisos. Un slug que no existe redirige al listado general y se salta.
      # max_avisos se reparte en partes iguales entre las zonas.
      zonas: &zonas_adondevivir
        - miraflores
        - santiago-de-surco
        - san-isidro
        - barranco
        - san-borja
        - jesus-maria
        - lince
        - magdalena
        - pueblo-libre
        - san-miguel
        - surquillo
        - la-molina
        - chorrillos
        - los-olivos
        - la-victoria
        - lima-cercado
        - brena
        - callao
        - san-juan-de-lurigancho
      alquiler:
        url: "https://www.adondevivir.com/departamentos-en-alquiler-en-{zona}-pagina-{pagina}.html"
        zonas: *zonas_adondevivir
        max_avisos: 500
      venta:
        url: "https://www.adondevivir.com/departamentos-en-venta-en-{zona}-pagina-{pagina}.html"
        zonas: *zonas_adondevivir
        max_avisos: 500
    urbania:
      activo: false              # Fase 5. Misma plataforma (Navent) que adondevivir: hay que verificar las URLs
      alquiler:
        url: "https://urbania.pe/buscar/alquiler-de-departamentos-en-lima?page={pagina}"
        max_avisos: 100
      venta:
        url: "https://urbania.pe/buscar/venta-de-departamentos-en-lima?page={pagina}"
        max_avisos: 100

limpieza:
  # Polígonos distritales (los mismos del mapa): ubican los avisos cuya ubicación solo dice «Lima, Lima»
  limites: ubika-app/public/geo/distritos-lima.geojson
  # Pin a más de esta distancia del distrito que declara el anunciante: el portal ubicó mal la calle.
  # Se descarta (queda en lat_portal/lon_portal) y se vuelve a ubicar con Google. Octubre 2026: los
  # desacuerdos de borde llegan a ~1,3 km y los pines errados empiezan en ~2,7 km.
  max_metros_fuera_distrito: 2000
  # Rangos plausibles; lo que quede fuera se descarta como error de carga del portal
  area_m2: [15, 1000]
  precio_pen:
    alquiler: [400, 40000]       # mensual
    venta: [40000, 15000000]
  dedup:
    tolerancia_precio: 0.03      # dos avisos con los mismos atributos y ±3% de precio son el mismo inmueble
    tolerancia_area_m2: 2

geocoding:
  sufijo: ", Lima, Perú"
  region: "pe"
  pausa_seg: 0.2
  # Caja de Lima Metropolitana y Callao: resultados fuera se marcan como sin_resultado
  caja: { lat_min: -12.55, lat_max: -11.55, lon_min: -77.25, lon_max: -76.60 }

entorno:
  radio_m: 500
  metros_por_minuto_a_pie: 80

calidad_vida:
  # Score de calidad de vida 0–10 (python -m ubika.pipeline --etapas calidad). Metodología completa:
  # docs/metodologia_calidad_vida.md. Si cambias pesos o fórmula, sube la versión: queda en cada fila.
  version: 2
  pesos:                         # suman 1; un componente sin dato reparte su peso entre los demás
    seguridad: 0.25              # denuncias a 500 m + homicidios del distrito (ver peso_homicidios)
    longevidad: 0.10             # edad promedio al morir por causas naturales en el distrito
    transporte: 0.15             # metros al transporte masivo más cercano (ver factor_corredor)
    servicios: 0.15              # colegios, salud, comisarías y malls a 500 m
    verde: 0.15                  # m² de parque a 500 m por habitante
    barrio: 0.10                 # mercados, súper, farmacias, restaurantes, gimnasios y bancos a 500 m
    ruido: 0.10                  # dB de tráfico estimados (menos = mejor)
  peso_homicidios: 0.5           # dentro de seguridad; el resto son denuncias
  # Transporte: un paradero de Corredor Complementario cuenta como una estación de Metro o Metropolitano
  # a factor_corredor veces su distancia (más lento y menos frecuente). distancia = min(masivo, factor × corredor)
  factor_corredor: 1.5
