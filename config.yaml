# Configuración de ubika.
# Los secretos (DATABASE_URL, GOOGLE_GEOCODING_API_KEY) van en .env, nunca aquí.

scraping:
  headless: true
  timeout_ms: 60000
  pausa_seg: [1.5, 3.5]          # pausa aleatoria entre páginas
  workers_detalle: 3             # pestañas en paralelo para el detalle de cada aviso
  fuentes:
    adondevivir:
      activo: true
      alquiler:
        url: "https://www.adondevivir.com/departamentos-en-alquiler-pagina-{pagina}-q-lima.html"
        max_avisos: 100
      venta:
        url: "https://www.adondevivir.com/departamentos-en-venta-pagina-{pagina}-q-lima.html"
        max_avisos: 100
    urbania:
      activo: false              # se reactiva en la Fase 5
      alquiler:
        url: "https://urbania.pe/buscar/alquiler-de-departamentos-en-lima?page={pagina}"
        max_avisos: 100
      venta:
        url: "https://urbania.pe/buscar/venta-de-departamentos-en-lima?page={pagina}"
        max_avisos: 100

limpieza:
  # Rangos plausibles; lo que quede fuera se descarta como error de carga del portal
  area_m2: [15, 1000]
  precio_pen:
    alquiler: [400, 40000]       # mensual
    venta: [40000, 15000000]
  dedup:
    tolerancia_precio: 0.03      # dos avisos con los mismos atributos y ±3% de precio son el mismo inmueble
    tolerancia_area_m2: 2

geocoding:
  sufijo: ", Lima, Perú"
  region: "pe"
  pausa_seg: 0.2
  # Caja de Lima Metropolitana y Callao: resultados fuera se marcan como sin_resultado
  caja: { lat_min: -12.55, lat_max: -11.55, lon_min: -77.25, lon_max: -76.60 }

entorno:
  radio_m: 500
  metros_por_minuto_a_pie: 80
