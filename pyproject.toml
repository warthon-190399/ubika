[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ubika"
version = "0.2.0"
description = "Inteligencia inmobiliaria para Lima: scraping, pipeline y datos de entorno"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
